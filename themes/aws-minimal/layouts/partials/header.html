<header class="site-header">
  <nav class="nav-inner">
    <a href="{{ "/" | relURL }}" class="site-logo">
      <span class="logo-bracket">[</span>the<span class="logo-dot">AWS</span>blog<span class="logo-bracket">]</span>
    </a>
    <ul class="nav-links">
      {{ range .Site.Menus.main }}
      <li>
        <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} class="active"{{ end }}>{{ .Name }}</a>
      </li>
      {{ end }}
    </ul>
  </nav>
</header>
